<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spare-Part Management</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

:root{
  --bg:#EBEDEE;
  --panel:#FFFFFF;
  --border:#D5D9DB;
  --border-strong:#B7BDC1;
  --ink:#161A1D;
  --muted:#5C6469;
  --faint:#8A9096;
  --amber:#F2B705;
  --amber-deep:#B9860A;
  --steel:#2C5F7C;
  --steel-deep:#1E4459;
  --green:#2E7D4F; --green-bg:#E4F2E9; --green-brd:#B9DCC4;
  --status-amber:#C77A0E; --amber-bg:#FBF0DA; --amber-brd:#EFCB84;
  --red:#B93E28; --red-bg:#FAE7E2; --red-brd:#EEB7A6;
  --radius:12px;
  --mono:'JetBrains Mono', monospace;
  --display:'Oswald', sans-serif;
  --body:'Inter', sans-serif;
  --shadow: 0 1px 2px rgba(20,24,27,0.06), 0 1px 1px rgba(20,24,27,0.04);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--body);
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1180px;margin:0 auto;padding:16px 16px 64px;}

/* ---------- header ---------- */
.hdr{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:18px 22px;background:var(--ink);border-radius:var(--radius);
  margin-bottom:14px;color:#fff;position:relative;overflow:hidden;
}
.hdr::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(135deg, rgba(242,183,5,0.08) 0 10px, transparent 10px 20px);
}
.hdr-inner{position:relative;z-index:1;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;width:100%;}
.hdr-left{display:flex;align-items:center;gap:12px;}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.gear-btn{
  flex:none;width:36px;height:36px;border-radius:9px;font-size:17px;line-height:1;
  border:1px solid rgba(255,255,255,0.22);background:rgba(255,255,255,0.07);color:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s;
}
.gear-btn:hover{background:rgba(255,255,255,0.16);}
.gear-btn.active{background:var(--amber);color:#2A2200;border-color:var(--amber-deep);}
.hdr-user{font-size:11.5px;color:#D8DCDE;display:flex;align-items:center;gap:8px;font-family:var(--mono);}
.hdr-user b{color:#fff;font-family:var(--body);font-weight:600;}
.link-btn{background:none;border:none;color:var(--amber);font-size:11px;cursor:pointer;padding:0;text-decoration:underline;font-family:var(--body);}
.hdr h1{
  font-family:var(--display);font-weight:600;font-size:20px;letter-spacing:0.3px;margin:0;
  text-transform:uppercase;
}
.hdr .sub{font-size:12.5px;color:#C7CDD1;margin-top:3px;font-family:var(--mono);}
.login-wrap{min-height:72vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-box{max-width:360px;width:100%;}
.login-title{font-family:var(--display);font-size:18px;text-transform:uppercase;letter-spacing:0.3px;margin:0 0 4px;text-align:center;}
.login-sub{text-align:center;color:var(--muted);font-size:12.5px;margin-bottom:16px;}
.readonly-field{
  border:1px solid var(--border);border-radius:8px;padding:9px 10px;font-size:13.5px;
  background:var(--bg);color:var(--ink);font-weight:600;
}
.hdr-tag{
  font-family:var(--mono);font-size:11px;background:var(--amber);color:#2A2200;
  padding:4px 9px;border-radius:5px;font-weight:700;letter-spacing:0.5px;
}

/* ---------- tabs ---------- */
.tabs{
  display:flex;gap:4px;background:var(--panel);border:1px solid var(--border);
  border-radius:var(--radius);padding:5px;margin-bottom:16px;overflow-x:auto;
}
.tab-btn{
  flex:1;min-width:88px;border:none;background:transparent;padding:9px 10px;
  border-radius:8px;font-family:var(--display);font-size:12.5px;font-weight:500;
  letter-spacing:0.4px;text-transform:uppercase;color:var(--muted);cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
}
.tab-btn:hover{background:var(--bg);}
.tab-btn.active{background:var(--ink);color:#fff;}

/* ---------- generic ---------- */
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);}
.panel + .panel{margin-top:14px;}
h2.section-title{
  font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:0.6px;
  color:var(--ink);margin:0 0 12px;display:flex;align-items:center;gap:8px;font-weight:600;
}
h2.section-title .count{
  font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--bg);
  padding:2px 7px;border-radius:20px;font-weight:500;
}
.muted{color:var(--muted);}
.hint{font-size:12px;color:var(--faint);margin-top:4px;}
button{font-family:var(--body);cursor:pointer;}
.btn{
  border:1px solid var(--border-strong);background:#fff;color:var(--ink);
  padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:600;
  transition:background .15s,border-color .15s;
}
.btn:hover{background:var(--bg);}
.btn-primary{background:var(--ink);border-color:var(--ink);color:#fff;}
.btn-primary:hover{background:#000;}
.btn-amber{background:var(--amber);border-color:var(--amber-deep);color:#2A2200;}
.btn-amber:hover{background:#e0ac04;}
.btn-danger{background:var(--red-bg);border-color:var(--red-brd);color:var(--red);}
.btn-danger:hover{background:#f5d3ca;}
.btn-sm{padding:5px 9px;font-size:12px;border-radius:6px;}
.btn-block{width:100%;}
input,select,textarea{
  width:100%;border:1px solid var(--border-strong);border-radius:8px;padding:9px 10px;
  font-family:var(--body);font-size:13.5px;color:var(--ink);background:#fff;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--steel);outline-offset:0;border-color:var(--steel);}
label.field-label{display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.4px;color:var(--muted);margin-bottom:5px;}
.field{margin-bottom:13px;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
@media(max-width:640px){.row2,.row3{grid-template-columns:1fr;}}

.badge{
  display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;
  font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:0.2px;
}
.badge-green{background:var(--green-bg);color:var(--green);border:1px solid var(--green-brd);}
.badge-amber{background:var(--amber-bg);color:var(--status-amber);border:1px solid var(--amber-brd);}
.badge-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-brd);}
.badge-steel{background:#E4EDF1;color:var(--steel-deep);border:1px solid #BBD3DE;}

.empty{
  text-align:center;padding:36px 20px;color:var(--muted);
}
.empty .big{font-family:var(--display);font-size:15px;color:var(--ink);margin-bottom:4px;text-transform:uppercase;}

/* ---------- overview stat strip ---------- */
.stat-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
@media(max-width:760px){.stat-strip{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;}
.stat-card .num{font-family:var(--display);font-size:28px;font-weight:600;line-height:1;}
.stat-card .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;font-weight:600;text-transform:uppercase;letter-spacing:0.3px;}
.stat-card.warn .num{color:var(--status-amber);}
.stat-card.bad .num{color:var(--red);}

.line-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:900px){.line-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:520px){.line-grid{grid-template-columns:1fr;}}
.line-card{border:1px solid var(--border);border-radius:10px;padding:13px 14px;background:#FBFCFC;}
.line-card .lname{font-family:var(--display);font-size:13.5px;text-transform:uppercase;font-weight:600;letter-spacing:0.3px;}
.line-card .lwh{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:2px;}
.line-card .lalert{margin-top:9px;font-size:12px;}
.line-card ul{list-style:none;margin:6px 0 0;padding:0;}
.line-card li{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-top:1px dashed var(--border);}
.line-card li:first-child{border-top:none;}

/* ---------- bin tag card (signature element) ---------- */
.tag-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px;}
.tag{
  position:relative;background:var(--panel);border:1px solid var(--border);border-radius:9px;
  padding:10px 10px 9px 14px;box-shadow:var(--shadow);overflow:hidden;
}
.tag::before{ /* status stripe */
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
}
.tag.st-green::before{background:var(--green);}
.tag.st-amber::before{background:var(--status-amber);}
.tag.st-red::before{background:var(--red);}
.tag .punch{
  position:absolute;top:8px;right:8px;width:11px;height:11px;border-radius:50%;
  background:var(--bg);border:1px solid var(--border-strong);
}
.tag .edit-btn{
  position:absolute;top:5px;right:24px;width:19px;height:19px;border-radius:50%;
  border:1px solid var(--border-strong);background:#fff;font-size:10px;line-height:1;
  display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:1;
}
.tag .edit-btn:hover{background:var(--bg);}
.tag .code{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--steel-deep);letter-spacing:0.3px;}
.tag .name{font-family:var(--display);font-size:13px;font-weight:500;margin:2px 0 4px;padding-right:15px;line-height:1.25;}
.tag .tear{border-top:1px dashed var(--border-strong);margin:5px 0;}
.tag .qty-row{display:flex;align-items:baseline;justify-content:space-between;}
.tag .qty{font-family:var(--display);font-size:18px;font-weight:600;}
.tag .qty-unit{font-size:10px;color:var(--muted);}
.tag .wh-list{margin-top:5px;font-size:10.5px;color:var(--muted);}
.tag .wh-list div{display:flex;justify-content:space-between;padding:1px 0;}
.tag .wh-list b{color:var(--ink);font-family:var(--mono);}
.tag .grp{font-size:10px;color:var(--faint);text-transform:uppercase;letter-spacing:0.3px;margin-top:1px;}
.tag .last-act{margin-top:6px;padding-top:6px;}

/* ---------- update / scan ---------- */
.scan-box{
  border:2px dashed var(--border-strong);border-radius:10px;padding:16px;background:#FBFCFC;
  display:flex;gap:12px;align-items:center;flex-wrap:wrap;
}
.scan-box input{flex:1;min-width:200px;font-family:var(--mono);font-size:15px;letter-spacing:0.5px;}
#cameraWrap{margin-top:10px;display:none;}
#cameraWrap.on{display:block;}
video{width:100%;max-width:340px;border-radius:8px;border:1px solid var(--border-strong);background:#000;}
.match-hit{
  margin-top:10px;padding:10px 12px;background:var(--green-bg);border:1px solid var(--green-brd);
  border-radius:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;
}
.match-miss{
  margin-top:10px;padding:10px 12px;background:var(--amber-bg);border:1px solid var(--amber-brd);
  border-radius:8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
}
.seg{display:flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
.seg button{flex:1;border:none;background:#fff;padding:9px 10px;font-size:13px;font-weight:700;font-family:var(--display);text-transform:uppercase;letter-spacing:0.3px;}
.seg button.on{background:var(--ink);color:#fff;}
.qty-input-wrap{display:flex;align-items:center;gap:8px;}
.qty-input-wrap button{width:36px;height:36px;border-radius:8px;border:1px solid var(--border-strong);background:#fff;font-size:17px;font-weight:700;}

/* ---------- xuất kho nhanh (overview) ---------- */
.xuat-quick{border:2px solid var(--amber);background:#FFFDF5;}
.xuat-quick .section-title{color:var(--amber-deep);}
#xuatCameraWrap{margin-top:10px;display:none;}
#xuatCameraWrap.on{display:block;}
.xuat-suggest-empty{margin-top:8px;font-size:12.5px;color:var(--muted);padding:8px 2px;}
.xuat-suggest-item{
  margin-top:8px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:#fff;
  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;transition:border-color .15s,background .15s;
}
.xuat-suggest-item:hover{border-color:var(--amber-deep);background:var(--amber-bg);}
.xsi-name{font-family:var(--display);font-size:13.5px;font-weight:500;}
.xsi-meta{font-size:11px;color:var(--muted);font-family:var(--mono);margin-top:1px;}
.xuat-status{padding:16px;border-radius:10px;text-align:center;margin-bottom:14px;}
.xuat-status.ok{background:var(--green-bg);border:1px solid var(--green-brd);}
.xuat-status.warn{background:var(--amber-bg);border:1px solid var(--amber-brd);}
.xuat-status.bad{background:var(--red-bg);border:1px solid var(--red-brd);}
.xuat-status .big-badge{font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:0.3px;}
.xuat-status .sub{font-size:12.5px;margin-top:6px;color:var(--muted);}
.xuat-wh-breakdown{margin-top:10px;display:flex;flex-direction:column;gap:4px;font-size:12.5px;text-align:left;padding:0 6px;}
.xuat-wh-breakdown div{display:flex;justify-content:space-between;}
.xuat-last{background:var(--bg);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:12px;line-height:1.6;}
.qty-input-wrap input{text-align:center;font-family:var(--mono);font-size:16px;font-weight:700;}

/* ---------- history table ---------- */
.hist-row{
  display:grid;grid-template-columns:110px 100px 70px 1fr 70px 120px;gap:10px;align-items:center;
  padding:9px 6px;border-bottom:1px solid var(--border);font-size:12.5px;
}
.hist-row.head{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:10.5px;letter-spacing:0.3px;border-bottom:2px solid var(--border-strong);}
.hist-row.with-del{grid-template-columns:110px 100px 70px 1fr 70px 120px 60px;}
.hist-row .t-time{font-family:var(--mono);color:var(--muted);font-size:11.5px;}
.hist-row .t-item{font-family:var(--mono);font-size:12px;}
@media(max-width:760px){
  .hist-row,.hist-row.with-del{grid-template-columns:1fr 1fr;grid-auto-rows:auto;row-gap:2px;}
  .hist-row.head{display:none;}
  .hist-row span::before{content:attr(data-lbl) ": ";font-weight:700;color:var(--faint);}
}

/* ---------- manage lists ---------- */
.mlist{list-style:none;margin:0;padding:0;}
.mlist li{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:8px 4px;border-bottom:1px solid var(--border);font-size:13.5px;
}
.mlist li:last-child{border-bottom:none;}
.mlist input{max-width:220px;}
.add-row{display:flex;gap:8px;margin-top:10px;}

/* toast */
#toast{
  position:fixed;bottom:18px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:8px;font-size:13.5px;
  font-weight:600;box-shadow:0 8px 24px rgba(0,0,0,0.25);opacity:0;pointer-events:none;
  transition:all .25s ease;z-index:999;display:flex;align-items:center;gap:8px;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast .dot{width:8px;height:8px;border-radius:50%;background:var(--amber);}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,24,27,0.55);display:none;align-items:center;justify-content:center;z-index:998;padding:16px;}
.modal-bg.on{display:flex;}
.modal{background:#fff;border-radius:12px;padding:22px;max-width:360px;width:100%;text-align:center;}
.modal h3{font-family:var(--display);text-transform:uppercase;font-size:15px;margin:0 0 6px;}
.modal img{margin:12px 0;border:1px solid var(--border);border-radius:8px;padding:8px;}
.modal .code{font-family:var(--mono);font-weight:700;font-size:15px;}

.loading{padding:80px 0;text-align:center;color:var(--muted);font-family:var(--mono);font-size:13px;}
.filter-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.filter-bar select,.filter-bar input{width:auto;min-width:130px;flex:1;}

/* last activity row on tag card */
.last-act{
  margin-top:9px;padding-top:8px;border-top:1px dashed var(--border-strong);
  font-size:11.5px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.last-act.clickable{cursor:pointer;}
.last-act.clickable:hover .la-text{color:var(--steel-deep);text-decoration:underline;}
.last-act .chev{color:var(--faint);font-size:12px;}
.last-act .la-dot{width:6px;height:6px;border-radius:50%;flex:none;}
.last-act .la-dot.xuat{background:var(--red);}
.last-act .la-dot.nhap{background:var(--green);}
.last-act .la-text{flex:1;}

/* modal transaction detail */
.modal.wide{max-width:420px;text-align:left;}
.detail-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
.detail-row:last-child{border-bottom:none;}
.detail-row b{font-family:var(--mono);}
.mini-hist{margin-top:14px;}
.mini-hist .mh-item{padding:8px 0;border-top:1px dashed var(--border);font-size:12px;}
.mini-hist .mh-item:first-child{border-top:none;}
.mini-hist .mh-top{display:flex;justify-content:space-between;color:var(--muted);font-family:var(--mono);font-size:11px;}
.mini-hist .mh-note{margin-top:2px;color:var(--ink);}

/* update sub-tabs */
.subtabs{display:flex;gap:6px;margin-bottom:14px;}
.subtabs button{
  border:1px solid var(--border-strong);background:#fff;padding:8px 14px;border-radius:8px;
  font-family:var(--display);font-size:12.5px;text-transform:uppercase;letter-spacing:0.3px;font-weight:600;color:var(--muted);
}
.subtabs button.on{background:var(--steel-deep);border-color:var(--steel-deep);color:#fff;}

/* import */
.import-drop{
  border:2px dashed var(--border-strong);border-radius:10px;padding:22px;text-align:center;background:#FBFCFC;
}
.import-drop input[type=file]{max-width:320px;margin:10px auto 0;}
.import-summary{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
.import-summary .chip{font-family:var(--mono);font-size:12px;padding:5px 10px;border-radius:20px;font-weight:700;}
.chip-ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-brd);}
.chip-warn{background:var(--amber-bg);color:var(--status-amber);border:1px solid var(--amber-brd);}
.chip-err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-brd);}
.import-table-wrap{max-height:420px;overflow:auto;border:1px solid var(--border);border-radius:8px;margin-top:10px;}
table.import-table{width:100%;border-collapse:collapse;font-size:12px;}
table.import-table th{position:sticky;top:0;background:var(--ink);color:#fff;text-align:left;padding:7px 8px;font-family:var(--display);text-transform:uppercase;font-size:10.5px;letter-spacing:0.3px;}
table.import-table td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:top;}
table.import-table tr.row-err{background:var(--red-bg);}
table.import-table tr.row-warn{background:var(--amber-bg);}
table.import-table .rstatus{font-weight:700;font-size:11px;}
table.import-table .rstatus.ok{color:var(--green);}
table.import-table .rstatus.warn{color:var(--status-amber);}
table.import-table .rstatus.err{color:var(--red);}
</style>
</head>
<body>
<div id="app"><div class="loading">Đang tải dữ liệu kho…</div></div>
<div id="toast"><span class="dot"></span><span id="toastMsg"></span></div>
<div class="modal-bg" id="modalBg"><div class="modal wide" id="modalContent"></div></div>

<!-- ============ FIREBASE SDK ============ -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
